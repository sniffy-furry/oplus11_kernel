name: build-kernel
on:
  workflow_dispatch:
    inputs:
      src_ref:
        description: "osm1019/kernel_oneplus_sm8550 ref (branch or FULL 40-char sha)"
        default: "a8f2ee936fd69e3301eb8e26c08a67c6fbbfd63d"
      ksu_date:
        description: "ReSukiSU/susfs4ksu snapshot = last commit before this date"
        default: "2026-08-02"
      fix_tree:
        description: "run dedupe/fix scripts (only for the Sep-12 tip, whose SUSFS integration is broken)"
        type: boolean
        default: false
      with_ksu:
        description: "keep KernelSU/SUSFS (needed so struct layouts / module_layout CRC match the stock kernel)"
        type: boolean
        default: true
      distro_fragment:
        description: "config fragment to merge on top of the stock config (empty = pure stock; android.fragment = stub kernel with kexec, stock-ABI). e.g. config/distro3.fragment"
        default: "config/android.fragment"
      stage1:
        description: "embed stage-1 initramfs (busybox+kexec+linux_hook) and log_buf_len=16M rdinit=/linux_hook"
        type: boolean
        default: false
      stage1_rdinit:
        description: "with stage1: also add rdinit=/linux_hook to the cmdline (false = payload embedded but unused, for bisecting)"
        type: boolean
        default: true
      android_clang:
        description: "use the exact Android clang r563880c (fails if it cannot be fetched); false = apt.llvm.org clang 21"
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Free disk + deps
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo apt-get update -q
          sudo apt-get install -y -q bc bison flex libssl-dev libelf-dev dwarves lz4 cpio python3 xz-utils zstd ccache
      - name: Fetch kernel source
        run: |
          git init -q src && cd src
          git remote add o https://github.com/osm1019/kernel_oneplus_sm8550
          git fetch -q --depth=1 o "${{ inputs.src_ref }}"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %ad %s'
      - name: Fetch OnePlus modules repo (kernel symlinks into ../sm8550-modules)
        run: |
          git clone -q --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8550-modules "$GITHUB_WORKSPACE/sm8550-modules"
          test -f src/kernel/oplus_cpu/thermal/Kconfig && echo "thermal symlink OK"
      - name: Fetch KernelSU (ReSukiSU), susfs4ksu and devicetrees (symlinked by the tree)
        run: |
          set -e
          # state as of the stock build (kernel tip 2026-09-12, ROM 2026-09-16)
          git clone -q --shallow-since=2026-06-15 https://github.com/ReSukiSU/ReSukiSU src/KernelSU
          git -C src/KernelSU checkout -q "$(git -C src/KernelSU rev-list -1 --before=${{ inputs.ksu_date }} HEAD)"
          git -C src/KernelSU log -1 --format='ReSukiSU %h %ad'
          git clone -q --shallow-since=2026-06-15 -b gki-android14-5.15 https://gitlab.com/simonpunk/susfs4ksu.git "$GITHUB_WORKSPACE/susfs4ksu"
          git -C "$GITHUB_WORKSPACE/susfs4ksu" checkout -q "$(git -C "$GITHUB_WORKSPACE/susfs4ksu" rev-list -1 --before=${{ inputs.ksu_date }} HEAD)"
          git -C "$GITHUB_WORKSPACE/susfs4ksu" log -1 --format='susfs4ksu %h %ad'
          git clone -q --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8550-devicetrees "$GITHUB_WORKSPACE/sm8550-devicetrees"
          cd src
          echo "broken symlinks:"; find . -path ./KernelSU -prune -o -type l ! -exec test -e {} \; -print | tee /tmp/broken.txt
          test ! -s /tmp/broken.txt
      - name: Remove SUSFS hunks applied twice upstream
        if: ${{ inputs.fix_tree }}
        run: |
          python3 tools/dedupe_susfs.py src
          python3 tools/fix_ksu_hooks.py src
      - name: Get Android clang r563880c (exact stock toolchain)
        if: ${{ inputs.android_clang }}
        run: |
          tools/get_android_clang.sh clang-r563880c $HOME/aclang
          echo "$(cat $HOME/aclang/.pathfile)" >> $GITHUB_PATH
      - name: Get clang (apt.llvm.org 21)
        if: ${{ !inputs.android_clang }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 21 all
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld
          for t in llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do sudo ln -sf /usr/bin/$t-21 /usr/local/bin/$t; done
      - name: Build recent pahole (BTF needs it; keeps struct module layout = stock)
        run: |
          sudo apt-get install -y -q cmake libdw-dev libelf-dev zlib1g-dev
          git clone -q --depth=1 --recurse-submodules --shallow-submodules -b v1.30 https://github.com/acmel/dwarves "$HOME/dwarves"
          cmake -S "$HOME/dwarves" -B "$HOME/dwarves/build" -D__LIB=lib -DCMAKE_BUILD_TYPE=Release
          make -C "$HOME/dwarves/build" -j"$(nproc)"
          sudo make -C "$HOME/dwarves/build" install
          sudo ldconfig
          pahole --version
      - name: No "+" suffix in kernel version
        run: printf '' > src/.scmversion
      - name: Build stage-1 payload (static busybox + kexec)
        if: ${{ inputs.stage1 }}
        run: tools/build_stage1.sh $HOME/stage1
      - name: Configure
        working-directory: src
        run: |
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          # base = the exact stock .config from the phone (/proc/config.gz); never rebuild it from defconfigs
          mkdir -p out && zcat "$GITHUB_WORKSPACE/config/stock.config.gz" > out/.config
          if [ -n "${{ inputs.distro_fragment }}" ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config "$GITHUB_WORKSPACE/${{ inputs.distro_fragment }}"
          fi
          if [ "${{ inputs.with_ksu }}" != "true" ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config "$GITHUB_WORKSPACE/config/no_ksu.fragment"
          fi
          # keep the version string identical to the stock kernel so vendor modules (vermagic) still load
          scripts/config --file out/.config --disable LOCALVERSION_AUTO --set-str LOCALVERSION "-AmberKernelV1--g2c83db1b0208"
          if [ "${{ inputs.stage1 }}" = "true" ]; then
            scripts/config --file out/.config --set-str INITRAMFS_SOURCE "$HOME/stage1/initramfs.list"
            if [ "${{ inputs.stage1_rdinit }}" = "true" ]; then
              scripts/config --file out/.config --set-str CMDLINE "stack_depot_disable=on kasan.stacktrace=off kvm-arm.mode=protected cgroup_disable=pressure log_buf_len=16M rdinit=/linux_hook"
            fi
          fi
          # distro / no-ksu fragments are merged BEFORE olddefconfig
          make O=out olddefconfig
          grep -E 'CONFIG_KSU=|LOCALVERSION|DEVTMPFS=|PID_NS|USER_NS|SYSVIPC|FHANDLE|CGROUP_PIDS|FRAMEBUFFER_CONSOLE' out/.config
      - name: Config diff vs stock
        run: python3 tools/cfgdiff.py src/out/.config config/stock.config.gz
      - name: Build Image
        working-directory: src
        run: |
          export ARCH=arm64 LLVM=1 LLVM_IAS=1 KBUILD_BUILD_USER=build KBUILD_BUILD_HOST=gha
          set -o pipefail
          mkdir -p $GITHUB_WORKSPACE/dist
          if ! make O=out -j$(nproc) Image > $GITHUB_WORKSPACE/dist/build.log 2>&1; then
            echo "===== BUILD FAILED: first errors ====="
            grep -nE 'error:|Error [0-9]|\*\*\*|undefined|not found|No such' $GITHUB_WORKSPACE/dist/build.log | head -25
            echo "===== last lines ====="
            tail -15 $GITHUB_WORKSPACE/dist/build.log
            exit 1
          fi
          make O=out kernelrelease
      - name: Verify stage-1 payload is inside the image
        if: ${{ inputs.stage1 }}
        working-directory: src
        run: |
          cpio -t < out/usr/initramfs_data.cpio 2>/dev/null | tee /tmp/l.txt
          grep -qx linux_hook /tmp/l.txt && grep -qx linux/busybox /tmp/l.txt && grep -qx linux/keystate /tmp/l.txt
          grep -c 'rdinit=/linux_hook' out/.config || true
      - name: Compare with stock
        working-directory: src
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          cp out/arch/arm64/boot/Image out/.config $GITHUB_WORKSPACE/dist/
          make O=out -s kernelrelease > $GITHUB_WORKSPACE/dist/kernelrelease.txt
          cat $GITHUB_WORKSPACE/dist/kernelrelease.txt
          # module_layout CRC from the built vmlinux (stock = 0xedfc7a5c)
          llvm-nm out/vmlinux 2>/dev/null | grep -E '__crc_module_layout' | tee $GITHUB_WORKSPACE/dist/module_layout_crc.txt || true
          ls -la $GITHUB_WORKSPACE/dist
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-oplus11-${{ github.run_number }}
          path: dist/
